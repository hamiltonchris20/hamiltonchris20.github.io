<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Schematic vertical phase-spiral in the Galactic disk">
  <rect width="640" height="360" fill="#f5f4f1"/>
  <line x1="80" y1="300" x2="560" y2="300" stroke="#d0cdc6" stroke-width="1"/>
  <line x1="320" y1="40" x2="320" y2="300" stroke="#d0cdc6" stroke-width="1"/>
  <path d="M100 200 C180 80, 260 280, 340 120 S500 240, 540 160" fill="none" stroke="#355e3b" stroke-width="2"/>
  <path d="M100 220 C200 140, 280 300, 380 180" fill="none" stroke="#355e3b" stroke-width="1" opacity="0.35"/>
  <text x="560" y="295" fill="#355e3b" font-size="11" font-family="Titillium Web, sans-serif">z</text>
  <text x="325" y="55" fill="#355e3b" font-size="11" font-family="Titillium Web, sans-serif">v_z</text>
  <text x="320" y="330" text-anchor="middle" fill="#6b6b6b" font-family="Titillium Web, sans-serif" font-size="13">Galactic echoes &amp; vertical phase-spirals</text>
</svg>
